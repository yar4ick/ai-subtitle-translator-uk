[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-subtitle-translator-uk"
dynamic = ["version"]
description = "AI translation of SRT subtitles into Ukrainian, token-efficient, works with any AI agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/yar4ick/ai-subtitle-translator-uk"

[project.scripts]
aisubs = "aisubs.cli:main"

[tool.setuptools]
packages = ["aisubs"]

[tool.setuptools.package-data]
aisubs = ["prompts/*.md"]

[tool.setuptools.dynamic]
version = { attr = "aisubs.__version__" }
